name: Monthly Hiking Routes Update

# Run on the 1st of each month at 08:57 AM UTC
on:
  schedule:
    - cron: '57 8 1 * *'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  update-routes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run auto-add routes script
        run: python3 scripts/auto_add_routes.py

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Check if routes were added
        id: check_changes
        run: |
          if git diff --quiet HEAD scrapers/hiking/schweizmobil.py; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add scrapers/hiking/schweizmobil.py
          MONTH_YEAR=$(date +"%B %Y")
          git commit -m "Feat: Add 10 new hiking routes ($MONTH_YEAR)"
          git push origin main

      - name: Regenerate website
        if: steps.check_changes.outputs.has_changes == 'true'
        run: python3 main.py

      - name: Commit and push updated website
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add output/index.html
          git commit -m "Regen: Update website with new routes"
          git push origin main

      - name: Summary
        run: |
          echo "✅ Monthly hiking routes update completed"
          echo "Routes added from: scripts/auto_add_routes.py"
          echo "Website regenerated: output/index.html"
